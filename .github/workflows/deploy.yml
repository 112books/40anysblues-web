name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresca les estadístiques cada hora encara que no hi hagi canvis al codi
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Comprova dades i traduccions
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-stats.py
          python3 scripts/check-i18n.py

      - name: Estadístiques (GoatCounter)
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/fetch-stats.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.159.0'
          extended: true

      - name: Build
        run: hugo --minify --baseURL "https://40anysblues.112books.eu/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
