baseURL = 'https://40anysblues.112books.eu/'
title = '40 Anys de blues a Barcelona'
theme = '40anys'
defaultContentLanguage = 'ca'
defaultContentLanguageInSubdir = false

[languages]
  [languages.ca]
    languageName = 'Català'
    languageCode = 'ca'
    weight = 1
    title = '40 Anys de blues a Barcelona'
    contentDir = 'content/ca'
    [languages.ca.params]
      description = "Arxiu fotogràfic i biogràfic de l'escena del blues barcelonina"
  [languages.es]
    languageName = 'Castellano'
    languageCode = 'es'
    weight = 2
    disabled = true
  [languages.en]
    languageName = 'English'
    languageCode = 'en'
    weight = 3
    disabled = true

[taxonomies]
  instrument = 'instruments'
  banda = 'bands'

# --- Esdeveniment i venda del llibre: font única de dates i textos ---
# El panell lateral canvia sol de contingut segons aquestes dates (hora local catalana).
[params.esdeveniment]
  tab = 'El llibre'
  titol = 'Presentació del llibre + Exposició fotogràfica'
  obra = '40 anys de blues a Barcelona'
  data_text = '6 de novembre · 19h'
  data_curta = '6 de novembre'
  inici = '2026-11-06T19:00:00+01:00'
  # El web es manté tancat (només el pop-up) fins a aquest moment: una hora abans.
  obertura = '2026-11-06T18:00:00+01:00'
  lloc = 'Centre Cultural Collblanc La Torrassa'
  adreca = "C/ Mare de Déu dels Desemparats, 87 · L'Hospitalet de Llobregat"
  maps = "https://maps.google.com/?q=Centre+Cultural+Collblanc+La+Torrassa,+L%27Hospitalet+de+Llobregat"
  ics = '/40anysblues.ics'

[params.venda]
  preu = '38'
  preu_soci = '33'
  email = 'info@societatbluesbarcelona.org'
  assumpte = 'Reserva 40 anys de blues'
  reserva_fins = '2026-11-04T23:59:59+01:00'
  reserva_fins_text = 'dimecres 4 de novembre'

[params]
  author = 'Joan Linux'
  goatcounter = '40anysbluesbcn'
  password_protected = false
  # Canal de Telegram (font única per a tot el web)
  telegram = 'https://t.me/blues40anysbcn'
  telegram_name = '40 anys de blues a Barcelona'

[outputs]
  home = ["HTML", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
