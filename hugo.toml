baseURL = 'https://40anysblues.112books.eu/'
title = '40 Anys de blues a Barcelona'
theme = '40anys'
defaultContentLanguage = 'ca'
defaultContentLanguageInSubdir = false

[languages]
  [languages.ca]
    label = 'Català'
    locale = 'ca'
    weight = 1
    title = '40 Anys de blues a Barcelona'
    contentDir = 'content/ca'
    [languages.ca.params]
      description = "Arxiu fotogràfic i biogràfic de l'escena del blues barcelonina"
  [languages.es]
    label = 'Castellano'
    locale = 'es-ES'
    weight = 2
    title = '40 Anys de blues a Barcelona'
    contentDir = 'content/es'
    [languages.es.params]
      description = "Archivo fotográfico y biográfico de la escena del blues barcelonés"
  [languages.en]
    label = 'English'
    locale = 'en'
    weight = 3
    title = '40 Anys de blues a Barcelona'
    contentDir = 'content/en'
    [languages.en.params]
      description = "Photographic and biographical archive of Barcelona's blues scene"

[taxonomies]
  instrument = 'instruments'
  banda = 'bands'

# --- Esdeveniment i venda del llibre: font única de dates i textos ---
# El panell lateral canvia sol de contingut segons aquestes dates (hora local catalana).
[params.esdeveniment]
  obra = '40 anys de blues a Barcelona'
  inici = '2026-11-06T19:00:00+01:00'
  # El web es manté tancat (només el pop-up) fins a aquest moment. Estava previst
  # una hora abans de la presentació; el 6/11 s'ha avançat al matí perquè no hi
  # havia ningú amb ordinador per comprovar l'obertura a les 18:00.
  obertura = '2026-11-06T08:00:00+01:00'
  lloc = 'Centre Cultural Collblanc La Torrassa'
  adreca = "C/ Mare de Déu dels Desemparats, 87 · L'Hospitalet de Llobregat"
  maps = "https://maps.google.com/?q=Centre+Cultural+Collblanc+La+Torrassa,+L%27Hospitalet+de+Llobregat"
  ics = '/40anysblues.ics'

[params.venda]
  preu = '38'
  preu_soci = '33'
  email = 'info@societatbluesbarcelona.org'
  reserva_fins = '2026-11-04T23:59:59+01:00'

[params]
  author = 'Joan Linux'
  # Puja aquest valor quan canviï el CSS per forçar la recàrrega
  asset_version = '2026-11-11a'
  goatcounter = '40anysbluesbcn'
  password_protected = false
  # Canal de Telegram (font única per a tot el web)
  telegram = 'https://t.me/blues40anysbcn'
  telegram_name = '40 anys de blues a Barcelona'
  # Músics que no surten mai al «Músic destacat» de la portada (id = carpeta)
  aleatori_exclosos = ['toni-pedrol', 'julio-lobos', 'carrie-lewis', 'quico-pi-de-la-serra']

[outputs]
  home = ["HTML", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
