# --- Portada ---
home_h1 = "La historia del Blues en Barcelona"
home_p1 = "Bienvenidos a <em>40 anys de blues a Barcelona</em>. Este sitio web nace del resultado de la edición del libro del mismo nombre."
home_p2 = "Desde que se inició en 2020, hemos fotografiado a todos los protagonistas del Blues en la ciudad condal."
home_p3 = "El pasado 6 de noviembre presentamos la edición definitiva del libro, <em>«40 anys de Blues a Barcelona»</em>. Antes habíamos publicado <a href=\"https://www.112books.eu/producte/preses-falses-40-anys-de-blues-a-barcelona/\" target=\"_blank\" rel=\"noopener\"><em>«Preses Falses, 40 anys de Blues a Barcelona»</em></a>, un pequeño avance con las fotografías que se descartaron en las sesiones y que nos sirvió para hacer el libro final, que ya podéis disfrutar. Gracias a todos los protagonistas de la escena del Blues por su colaboración en este proyecto tan especial."
home_p4 = "La fotografía tradicional como herramienta de unión. El proyecto lo inició Joan Linux al intentar inmortalizar a los músicos que ha conocido en sus años como fotógrafo del Festival de Blues de Barcelona. Y, como el propio estilo de música, la fotografía antigua, química, en blanco y negro y realizada con cachivaches que tienen los mismos, si no más, años que los primeros instrumentos del blues rural de Estados Unidos."
