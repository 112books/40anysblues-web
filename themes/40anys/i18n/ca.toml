home_h1 = "La història del Blues a Barcelona"
home_p1 = "Benvinguts a <em>40 anys de Blues a Barcelona</em>. Aquest web neix del resultat de l'edició del llibre del mateix nom."
home_p2 = "Des del 2020 que es va iniciar, hem fotografiat tots els protagonistes del Blues a la ciutat comptal."
home_p3 = "Avui dia tenim editat el primer treball del projecte: <a href=\"https://www.112books.eu/producte/preses-falses-40-anys-de-blues-a-barcelona/\" target=\"_blank\" rel=\"noopener\"><em>«Preses Falses, 40 anys de Blues a Barcelona»</em></a>, un petit llibre de retrats de quasi 140 músics de Blues amb presència a Barcelona."
home_p4 = "La fotografia tradicional com a eina d'unió. El projecte es va iniciar per en Joan Linux en intentar immortalitzar als músics que ha conegut en els seus anys de fotògraf del Festival de Blues de Barcelona. I com el mateix estil de música, la fotografia vella, química, en blanc i negre i realitzada amb andròmines que tenen els mateixos, si no més, anys que els primers instruments del blues rural dels Estats Units."
