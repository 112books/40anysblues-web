# --- Home ---
home_h1 = "The history of the Blues in Barcelona"
home_p1 = "Welcome to <em>40 anys de blues a Barcelona</em>. This website is the result of the book of the same name."
home_p2 = "Since the project began in 2020, we have photographed every protagonist of the Blues in the city."
home_p3 = "Today we have published the first work of the project: <a href=\"https://www.112books.eu/producte/preses-falses-40-anys-de-blues-a-barcelona/\" target=\"_blank\" rel=\"noopener\"><em>Preses Falses, 40 anys de Blues a Barcelona</em></a>, a small book of portraits of almost 140 Blues musicians who have played in Barcelona."
home_p4 = "Traditional photography as a tool for bringing people together. The project was started by Joan Linux in an attempt to immortalise the musicians he has met during his years as photographer of the Barcelona Blues Festival. And, like the music itself, the photography is old, chemical, black and white, made with contraptions as old, if not older, than the first instruments of rural American blues."
