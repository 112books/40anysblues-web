{{ define "main" }}
<article class="content-page visites-page">
  <div class="container">

    <div class="visites-header">
      <h1>{{ i18n "visites_titol" }}</h1>
      <p class="visites-intro">{{ i18n "visites_intro" }}</p>
      <p class="visites-nota">{{ i18n "visites_nota" | safeHTML }}</p>
    </div>

    <div class="visites-separador">
      <span class="visites-separador-icon">♦</span>
    </div>

    <div class="visites-giscus" id="giscus-wrap">
      <!-- CONFIGURACIÓ GISCUS — cal omplir repo-id i category-id -->
      <!-- Obtenir-los a: https://giscus.app -->
      <script src="https://giscus.app/client.js"
        data-repo="112books/40anysblues-web"
        data-repo-id="PENDENT"
        data-category="General"
        data-category-id="PENDENT"
        data-mapping="specific"
        data-term="llibre-de-visites"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="{{ .Site.BaseURL }}giscus-theme.css"
        data-lang="{{ .Site.Language.Lang }}"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
      </script>
    </div>

  </div>
</article>
{{ end }}
