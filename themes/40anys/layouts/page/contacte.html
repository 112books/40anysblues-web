{{ define "main" }}
<article class="content-page contacte-page">
  <div class="container">
    <div class="form-page-header">
      <h1>{{ i18n "contacte_titol" }}</h1>
      <p class="form-page-sub">{{ i18n "contacte_sub" }}</p>
    </div>

    <div class="form-wrap">
      <form id="contacte-form"
            action="https://formspree.io/f/xgobydqg"
            method="POST"
            class="blues-form">

        <div class="form-group">
          <label for="cf-nom">{{ i18n "contacte_nom" }}</label>
          <input type="text" id="cf-nom" name="nom" required autocomplete="name" placeholder="{{ i18n "contacte_nom_ph" }}">
        </div>

        <div class="form-group">
          <label for="cf-email">{{ i18n "contacte_email" }}</label>
          <input type="email" id="cf-email" name="email" required autocomplete="email" placeholder="{{ i18n "contacte_email_ph" }}">
        </div>

        <div class="form-group">
          <label for="cf-assumpte">{{ i18n "contacte_assumpte" }}</label>
          <select id="cf-assumpte" name="assumpte">
            <option value="">{{ i18n "contacte_selecciona" }}</option>
            <option value="informació">{{ i18n "contacte_opt_info" }}</option>
            <option value="músic">{{ i18n "contacte_opt_music" }}</option>
            <option value="premsa">{{ i18n "contacte_opt_premsa" }}</option>
            <option value="col·laboració">{{ i18n "contacte_opt_col" }}</option>
            <option value="altre">{{ i18n "contacte_opt_altre" }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cf-missatge">{{ i18n "contacte_missatge" }}</label>
          <textarea id="cf-missatge" name="missatge" required rows="6" placeholder="{{ i18n "contacte_missatge_ph" }}"></textarea>
        </div>

        <div class="form-group form-group--check">
          <label class="check-label">
            <input type="checkbox" name="rgpd" required>
            <span>{{ i18n "contacte_rgpd" (dict "url" (relLangURL "/legal/privacitat/")) | safeHTML }}</span>
          </label>
        </div>

        <input type="text" name="_gotcha" style="display:none">
        <input type="hidden" name="_subject" value="Contacte 40 Anys de Blues">
        <input type="hidden" name="_next" value="{{ absLangURL "/contacte/gracies/" }}">

        <button type="submit" class="btn-blues">{{ i18n "contacte_enviar" }}</button>
      </form>

      <div id="contacte-ok" class="form-success" hidden>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        <h2>{{ i18n "contacte_ok_titol" }}</h2>
        <p>{{ i18n "contacte_ok_text_plain" }} <span id="cf-email-confirm"></span>.</p>
      </div>
    </div>

    <div class="contacte-alt">
      <p>{{ i18n "contacte_alt" }} <a href="mailto:hola@112books.eu">hola@112books.eu</a></p>
    </div>
  </div>
</article>

<script>
(function() {
  var form = document.getElementById('contacte-form');
  var ok = document.getElementById('contacte-ok');
  if (!form) return;
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var data = new FormData(form);
    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.textContent = {{ i18n "enviant" | jsonify }};
    fetch(form.action, {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    }).then(function(r) {
      if (r.ok) {
        var emailEl = document.getElementById('cf-email-confirm');
        if (emailEl) emailEl.textContent = data.get('email');
        form.hidden = true;
        ok.hidden = false;
      } else {
        btn.disabled = false;
        btn.textContent = {{ i18n "contacte_enviar" | jsonify }};
        alert({{ i18n "contacte_error" | jsonify }});
      }
    }).catch(function() {
      btn.disabled = false;
      btn.textContent = {{ i18n "contacte_enviar" | jsonify }};
      alert({{ i18n "contacte_error_xarxa" | jsonify }});
    });
  });
})();
</script>
{{ end }}
