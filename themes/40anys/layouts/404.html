{{ define "robots" }}<meta name="robots" content="noindex, follow">{{ end }}
{{ define "title" }}Pàgina no trobada · {{ .Site.Title }}{{ end }}
{{ define "main" }}
<section class="content-page">
  <div class="container">
    <div class="error-page">
      <div class="error-code" aria-hidden="true">404</div>
      <h1>No s'ha trobat la pàgina</h1>
      <p>La pàgina que busques no existeix o s'ha mogut. Prova de cercar-la amb el formulari següent.</p>
      <form class="error-search" action="{{ relLangURL "/cerca/" }}" method="get" role="search">
        <input type="search" name="q" placeholder="Músic, instrument, formació, sala..." aria-label="Cerca" autocomplete="off">
        <button type="submit" class="btn-blues">Cerca</button>
      </form>
      <p class="error-back"><a href="{{ relLangURL "/" }}">Tornar a l'inici</a></p>
    </div>
  </div>
</section>
{{ end }}
