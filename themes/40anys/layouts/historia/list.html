{{ define "main" }}
<section class="content-page historia-page">
  <div class="container">
    <div class="text-offset">
      <h1>{{ .Title }}</h1>
      {{ $img := partial "foto.html" (dict "page" .) }}
      <div class="historia-content">
        {{ if $img }}
        <div class="historia-foto">
          {{ partial "img.html" (dict "res" $img "alt" .Title "sizes" "(max-width: 900px) 100vw, 720px") }}
        </div>
        {{ end }}
        {{ with .Content }}
        <div class="page-content">{{ . }}</div>
        {{ end }}
      </div>
    </div>
  </div>
</section>
{{ end }}
