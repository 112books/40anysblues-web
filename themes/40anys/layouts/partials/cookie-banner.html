<div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="{{ i18n "cookies_aria" }}" hidden>
  <p class="cookie-text">
    {{ i18n "cookies_text" }} <a href="{{ relLangURL "/legal/cookies/" }}">{{ i18n "cookies_mes" }}</a>
  </p>
  <div class="cookie-btns">
    <button id="cookie-accept" class="btn-blues btn-blues--sm">{{ i18n "cookies_ok" }}</button>
    <a href="{{ relLangURL "/legal/cookies/" }}" class="cookie-link">{{ i18n "cookies_politica" }}</a>
  </div>
</div>

<script>
(function() {
  var banner = document.getElementById('cookie-banner');
  var btn = document.getElementById('cookie-accept');
  if (!banner) return;
  if (!localStorage.getItem('cookies_ok')) {
    banner.hidden = false;
  }
  btn.addEventListener('click', function() {
    localStorage.setItem('cookies_ok', '1');
    banner.hidden = true;
  });
})();
</script>
